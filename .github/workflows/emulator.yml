name: Android emulator tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', '.github/workflows/emulator.yml']
  workflow_dispatch:
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build an isolated newer APK for installer verification tests
        run: |
          ./gradlew :app:assembleDebug -PfixtureVersion=7 --no-daemon
          mkdir -p app/src/androidTest/assets
          cp app/build/outputs/apk/debug/app-debug.apk app/src/androidTest/assets/future-fixture.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
